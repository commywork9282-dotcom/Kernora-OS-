set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1

loadfont /boot/grub/themes/kernora/roboto-regular-16.pf2
loadfont /boot/grub/themes/kernora/roboto-medium-16.pf2
loadfont /boot/grub/themes/kernora/roboto-regular-24.pf2
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
terminal_input console serial
terminal_output gfxterm serial
set theme=/boot/grub/themes/kernora/theme.txt

insmod part_gpt
insmod part_msdos
insmod ext2
insmod btrfs
insmod regexp
for device in (*); do
    if [ -z "$installed" ]; then
        if [ -f "$device/usr/share/kernora/settings/Main.qml" ]; then
            if [ -f "$device/boot/grub/grub.cfg" ]; then
                set installed="$device"
            fi
        fi
    fi
done
if [ -n "$installed" ]; then
    export installed
    menuentry "Kernora OS · Установленная система" --id installed {
        set root="$installed"
        configfile /boot/grub/grub.cfg
    }
fi

menuentry "Kernora OS · Русский" {
    search --no-floppy --set=root --label KERNORA_1_EMBER
    linux /live/vmlinuz boot=live live-media-path=/live hostname=kernora kernora.lang=ru_RU.UTF-8 quiet loglevel=3 splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 console=ttyS0,115200n8 console=tty0
    initrd /live/initrd.img
}

menuentry "Kernora OS · English" {
    search --no-floppy --set=root --label KERNORA_1_EMBER
    linux /live/vmlinuz boot=live live-media-path=/live hostname=kernora kernora.lang=en_US.UTF-8 quiet loglevel=3 splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 console=ttyS0,115200n8 console=tty0
    initrd /live/initrd.img
}

menuentry "Kernora OS · Safe graphics" {
    search --no-floppy --set=root --label KERNORA_1_EMBER
    set gfxpayload=text
    linux /live/vmlinuz boot=live live-media-path=/live hostname=kernora nomodeset console=tty0 console=ttyS0,115200n8 systemd.show_status=1
    initrd /live/initrd.img
}
