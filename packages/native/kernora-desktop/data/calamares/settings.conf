---
modules-search: [ /etc/calamares/modules, local, /usr/lib/calamares/modules ]

instances:
- id: upgrade
  module: shellprocess
  config: shellprocess-upgrade.conf
- id: drivers
  module: shellprocess
  config: shellprocess-drivers.conf
- id: efi
  module: shellprocess
  config: shellprocess-efi.conf
- id: wifi
  module: notesqml
  config: notesqml-wifi.conf
- id: style
  module: notesqml
  config: notesqml-style.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - notesqml@wifi
  - partition
  - usersq
  - notesqml@style
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - kernoralocales
  - usersq
  - kernorasetup
  - removeuser
  - shellprocess
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - packages
  - shellprocess@upgrade
  - shellprocess@drivers
  - shellprocess@efi
  - initramfscfg
  - initramfs
  - umount
- show:
  - finishedq

branding: kernora

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
