---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: upgrade
  module: shellprocess
  config: shellprocess-upgrade.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - usersq
  - removeuser
  - shellprocess
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - packages
  - shellprocess@upgrade
  - initramfscfg
  - initramfs
  - umount
- show:
  - finishedq

branding: kernora

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
