  - "rm -f /etc/systemd/system/multi-user.target.wants/kernora-boot-ready.service"
  - "rm -f /etc/systemd/system/kernora-boot-ready.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/kernora-live-language.service"
  - "rm -f /etc/systemd/system/kernora-live-language.service /usr/lib/kernora/live-language"
