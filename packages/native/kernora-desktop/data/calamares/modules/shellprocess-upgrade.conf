---
dontChroot: true
timeout: 60
verbose: true
script:
  - "-cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf"
  - command: "-chroot ${ROOT} sh -c 'apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold full-upgrade && update-grub'"
    timeout: 3600
    environment:
      - "DEBIAN_FRONTEND='noninteractive'"
i18n:
  name: "Installing the latest updates"
  name[ru]: "Установка последних обновлений"
