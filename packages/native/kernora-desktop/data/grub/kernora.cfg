case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in
  *" loglevel="*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT loglevel=3" ;;
esac
case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in
  *" vt.global_cursor_default="*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT vt.global_cursor_default=0" ;;
esac
if [ "$(id -u)" = 0 ] && [ ! -f /boot/grub/themes/kernora/theme.txt ] && [ -x /usr/libexec/kernora-grub-theme ]; then
  /usr/libexec/kernora-grub-theme >/dev/null 2>&1 || true
fi
if [ -f /boot/grub/themes/kernora/theme.txt ]; then
  GRUB_THEME=/boot/grub/themes/kernora/theme.txt
elif [ -f /usr/share/grub/themes/kernora/theme.txt ]; then
  GRUB_THEME=/usr/share/grub/themes/kernora/theme.txt
fi
if [ -n "${GRUB_THEME:-}" ]; then
  GRUB_TERMINAL_OUTPUT=gfxterm
  GRUB_GFXMODE=1920x1080,1280x800,1024x768,auto
fi
