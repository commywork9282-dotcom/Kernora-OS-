[package]
name = "kernora-quickshare"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
dbus = { version = "0.9", features = ["futures"] }
dbus-crossroads = "0.5"
dbus-tokio = "0.7"
log = "0.4"
rqs_lib = { git = "https://github.com/nozwock/rquickshare.git", rev = "c9ac93f5584a4265e8da679ad689df5be1e80c6b", default-features = false, features = ["experimental"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch."https://github.com/Martichou/sys_metrics"]
sys_metrics = { path = "shim/sys_metrics" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
